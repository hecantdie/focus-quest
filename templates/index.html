<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Head: bts info the visitor does not see on page -->
     <meta charset=""UTF-8"> <!-- lets the page show any letter or symbol -->
     <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- fits phone screens-->
     <title> Focus Quest AI</title> <!-- words on browser tab-->

     <!-- Load the inter font from google fonts-->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

      <!--Load the CSS file. Flask fills in the double curly brace part w/ the real address.-->
      <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body>
    <!-- body/everything the visitor will see.-->
     <main class="container">

        <!-- Top Bar - app name on left, level and xp bar on the right. -->
         <header class="top">
            <h1>Focus Quest AI</h1>
            <div class="xp">
                <span id="level-text">Level 1</span>
                <!-- Gray track with a colored fill. JS changes the fills width.-->
                 <div class="xp-bar"><div id="xp-fill" class="xp-fill"></div></div>
                 <span id="xp-text">0 / 100 XP</span>
            </div>
         </header>

         <!-- Task box and button-->
          <form id="task-form" class="task-form">
            <label for="task-input">What are you avoiding?</label>
            <div class="row">
                <!-- maxlength stops typing after 200 characters; placeholder is the gray text-->
                 <input id="task-input" type="text" maxlength="200" placeholder="Study for my calc exam" autocomplete="off">
                 <button type="submit">Break it down</button>
            </div>
          </form>

          <!-- Empty spot where JS shows messages like "+10 XP"-->
           <p id="message" class="message"></p>
           <!-- Empty numbered list. JS fills it with the steps.-->
            <ol id="step-list" class="step-list"></ol>
            
            <!-- Quest Card: Hidden until a quest is complete.-->
             <section id="card-section" class="card-selection" hidden>
                <h2>Quest complete</h2>
                <!-- a blank 1080 x 1080 image that JS draws the card on. -->
                 <canvas id="quest-card" width="1080" height="1080"></canvas>
                 <button id="download-card" type="button">Download card</button>
             </section>
     </main>

     <!-- Load my JS last, so all boxes above exist before it looks for them-->
      <script src="{{ url_for('static', filename='app.js')}}"></script>
</body>
</html>
